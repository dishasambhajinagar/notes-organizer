<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes & Files Portal</title>
  <style>
    body{font-family:Arial, sans-serif; background:#f4f6f8; padding:20px}
    .card{background:#fff; padding:20px; border-radius:10px; max-width:600px; margin:auto; text-align:center}
    h2{margin-top:0}
    button{padding:8px 12px; margin:6px; cursor:pointer; font-size:14px}
    input, textarea{width:100%; padding:10px; margin:10px 0}
    .hidden{display:none}
    .msg{color:#c00; font-size:14px}
    ul{text-align:left; list-style:none; padding:0}
    li{background:#f1f1f1; margin:8px 0; padding:10px; border-radius:6px}
    .file-actions{margin-top:6px}
  </style>
</head>
<body>

  <!-- HOME PAGE -->
  <div class="card" id="home">
    <h2>📂 Notes & Files</h2>
    <button onclick="goUpload()">⬆️ Upload</button>
    <button onclick="goView()">👁️ View</button>
  </div>

  <!-- PASSWORD PAGE -->
  <div class="card hidden" id="passwordPage">
    <h2>🔐 Enter Password to View</h2>
    <input type="password" id="viewPass" placeholder="Enter password" />
    <button onclick="checkPassword()">Continue</button>
    <p class="msg" id="passMsg"></p>
  </div>

  <!-- UPLOAD PAGE -->
  <div class="card hidden" id="uploadPage">
    <h2>⬆️ Upload</h2>
    <textarea id="note" rows="3" placeholder="Write note (optional)"></textarea>
    <input type="file" id="fileInput" />
    <input id="filename" placeholder="File name (example: file.pdf)" />
    <button onclick="saveData()">Save</button>
    <p id="uploadMsg"></p>
    <button onclick="goHome()">⬅️ Back</button>
  </div>

  <!-- VIEW PAGE -->
  <div class="card hidden" id="viewPage">
    <h2>👁️ View Uploaded Files</h2>
    <ul id="items"></ul>
    <button onclick="goHome()">⬅️ Back</button>
  </div>

<script>
const PASSWORD = 'arjun';

function hideAll(){
  ['home','passwordPage','uploadPage','viewPage'].forEach(id=>
    document.getElementById(id).classList.add('hidden')
  );
}

function goHome(){ hideAll(); document.getElementById('home').classList.remove('hidden'); }
function goUpload(){ hideAll(); document.getElementById('uploadPage').classList.remove('hidden'); }
function goView(){ hideAll(); document.getElementById('passwordPage').classList.remove('hidden'); }

function checkPassword(){
  const pass = document.getElementById('viewPass').value;
  const msg = document.getElementById('passMsg');
  if(pass === PASSWORD){
    hideAll();
    loadItems();
    document.getElementById('viewPage').classList.remove('hidden');
    msg.innerText = '';
  } else {
    msg.innerText = 'Wrong password';
  }
}

// SAVE DATA (LocalStorage with real file content)
function saveData(){
  const note = document.getElementById('note').value;
  const fileInput = document.getElementById('fileInput');
  const filename = document.getElementById('filename').value;
  const msg = document.getElementById('uploadMsg');

  if(!filename || fileInput.files.length === 0){
    msg.innerText = 'Please select a file and filename';
    return;
  }

  const reader = new FileReader();
  reader.onload = function(){
    const data = {
      name: filename,
      note: note,
      fileData: reader.result
    };

    const items = JSON.parse(localStorage.getItem('items') || '[]');
    items.push(data);
    localStorage.setItem('items', JSON.stringify(items));

    msg.innerText = 'File uploaded & saved ✅';
    document.getElementById('note').value = '';
    document.getElementById('filename').value = '';
    fileInput.value = '';
  };

  reader.readAsDataURL(fileInput.files[0]);
}

// LOAD & VIEW REAL FILES
function loadItems(){
  const list = document.getElementById('items');
  list.innerHTML = '';
  const items = JSON.parse(localStorage.getItem('items') || '[]');

  if(items.length === 0){
    list.innerHTML = '<li>No files uploaded</li>';
    return;
  }

  items.forEach((item, index)=>{
    const li = document.createElement('li');
    li.innerHTML = `<b>${item.name}</b>${item.note ? '<br>'+item.note : ''}`;

    const actions = document.createElement('div');
    actions.className = 'file-actions';

    const viewBtn = document.createElement('button');
    viewBtn.innerText = 'View / Download';
    viewBtn.onclick = () => openFile(item.fileData, item.name);

    actions.appendChild(viewBtn);
    li.appendChild(actions);
    list.appendChild(li);
  });
}

function openFile(dataUrl, name){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = name;
  a.target = '_blank';
  a.click();
}
</script>
</body>
</html>
